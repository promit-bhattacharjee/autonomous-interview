# LiveKit Server Configuration for Local Development
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302

# Development API key and secret matching .env.example
keys:
  devkey: secret

logging:
  level: info
