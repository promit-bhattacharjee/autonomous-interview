[project]
name = "interview"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Promit Bhattacharjee", email = "promitbhattacharjee.work@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.3.7",
    "langchain-openai>=1.6.1",
    "langgraph>=1.2.11",
    "livekit-agents>=1.8.0",
    "livekit-api>=1.2.1",
    "livekit-plugins-google>=1.8.0",
    "livekit-plugins-silero>=1.8.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
interview = "interview:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
