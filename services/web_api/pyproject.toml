[project]
name = "web_api"
version = "0.1.0"
description = "FastAPI, SSR Portal, and Relational Service for UKVI Voice Interview System"
readme = "README.md"
authors = [
    { name = "Promit Bhattacharjee", email = "promitbhattacharjee.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pydantic>=2.7.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
    "livekit-api>=1.2.1",
    "edge-tts>=7.2.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
