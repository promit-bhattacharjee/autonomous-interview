[project]
name = "langgraph_agent"
version = "0.1.0"
description = "Standalone LangGraph Engine and LiveKit Agent Worker for UKVI Credibility Interview"
readme = "README.md"
authors = [
    { name = "Promit Bhattacharjee", email = "promitbhattacharjee.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "dotenv>=0.9.9",
    "httpx>=0.27.0",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.3.7",
    "langchain-openai>=1.6.1",
    "langgraph>=1.2.11",
    "livekit-agents>=1.8.0",
    "livekit-api>=1.2.1",
    "livekit-plugins-google>=1.8.0",
    "livekit-plugins-silero>=1.8.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
